name: Construiește APK (Android)

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descarcă codul
        uses: actions/checkout@v4

      - name: Configurează Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurează Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalează pachetele
        run: npm install --legacy-peer-deps

      - name: Construiește aplicația web
        run: npm run build

      - name: Pregătește proiectul Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Compilează APK-ul Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Încarcă fișierul APK
        uses: actions/upload-artifact@v4
        with:
          name: Dispecerat-Flota-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
