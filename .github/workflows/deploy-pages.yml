name: Publică Web & iPhone/PWA (GitHub Pages)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descarcă codul
        uses: actions/checkout@v4

      - name: Configurează Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalează pachetele
        run: npm install --legacy-peer-deps

      - name: Configurează GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Construiește aplicația Web & PWA
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_STATIC_HOST: "true"
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: Încarcă artefactul Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publică pe GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
